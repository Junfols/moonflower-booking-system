<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonflower - Resort & Dining Online Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-moon text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Moonflower</h1>
                    <span class="text-xs text-slate-500 font-medium">Resort, Rooms & Restaurant</span>
                </div>
            </div>
            <a href="/admin" class="text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl border border-slate-200 transition">
                <i class="fa-solid fa-lock text-slate-500 mr-1.5"></i> Admin Portal
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">

        <!-- Navigation Tabs -->
        <div class="flex p-1.5 space-x-2 bg-slate-200/80 rounded-2xl max-w-md mx-auto mb-8 shadow-inner">
            <button id="tabRoomBtn" onclick="switchTab('rooms')" 
                class="flex-1 py-3 text-sm font-semibold rounded-xl flex items-center justify-center space-x-2 transition-all duration-200 bg-white text-indigo-600 shadow-sm">
                <i class="fa-solid fa-bed"></i>
                <span>Rooms & Stay</span>
            </button>
            <button id="tabTableBtn" onclick="switchTab('tables')" 
                class="flex-1 py-3 text-sm font-semibold rounded-xl flex items-center justify-center space-x-2 transition-all duration-200 text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-utensils"></i>
                <span>Restaurant Table</span>
            </button>
        </div>

        <!-- TAB 1: ROOMS BOOKING SECTION -->
        <div id="sectionRooms" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <i class="fa-regular fa-calendar-check text-indigo-600 mr-2"></i> Pangitaa ang Bakante nga Kwarto
                </h2>
                <form id="roomSearchForm" class="grid grid-cols-1 md:grid-cols-3 gap-4" onsubmit="searchRooms(event)">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Check-in Date</label>
                        <input type="date" id="roomCheckIn" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Check-out Date</label>
                        <input type="date" id="roomCheckOut" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-sm">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center shadow-md shadow-indigo-500/20">
                            <i class="fa-solid fa-magnifying-glass mr-2 text-sm"></i> Check Availability
                        </button>
                    </div>
                </form>
            </div>

            <div id="roomResultsContainer" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-base font-bold text-slate-900">Available Rooms</h3>
                    <span id="roomCountBadge" class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full border border-indigo-200"></span>
                </div>
                <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
            </div>
        </div>

        <!-- TAB 2: RESTAURANT RESERVATION SECTION -->
        <div id="sectionTables" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <i class="fa-solid fa-chair text-amber-600 mr-2"></i> Mag-reserve og Lamesa sa Restaurant
                </h2>
                <form id="tableSearchForm" class="grid grid-cols-1 md:grid-cols-4 gap-4" onsubmit="searchTables(event)">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Petsa</label>
                        <input type="date" id="tableDate" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Oras (Time Slot)</label>
                        <select id="tableTimeSlot" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 text-sm bg-white">
                            <option value="11:00-13:00">11:00 AM - 01:00 PM (Lunch)</option>
                            <option value="13:00-15:00">01:00 PM - 03:00 PM (Afternoon)</option>
                            <option value="18:00-20:00">06:00 PM - 08:00 PM (Dinner Slot 1)</option>
                            <option value="20:00-22:00">08:00 PM - 10:00 PM (Dinner Slot 2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gidaghanon (Pax)</label>
                        <input type="number" id="tablePax" min="1" max="20" value="2" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 text-sm">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center shadow-md shadow-amber-500/20">
                            <i class="fa-solid fa-magnifying-glass mr-2 text-sm"></i> Check Tables
                        </button>
                    </div>
                </form>
            </div>

            <div id="tableResultsContainer" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-base font-bold text-slate-900">Available Tables</h3>
                    <span id="tableCountBadge" class="text-xs bg-amber-50 text-amber-700 font-semibold px-2.5 py-1 rounded-full border border-amber-200"></span>
                </div>
                <div id="tablesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>
        </div>

    </main>

    <!-- BOOKING MODAL -->
    <div id="bookingModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-900 mb-1">Kumpirmaha ang Booking</h3>
            <p id="modalSubtitle" class="text-xs text-slate-500 mb-5 leading-relaxed"></p>

            <form id="modalForm" onsubmit="submitBooking(event)" class="space-y-4">
                <input type="hidden" id="selectedItemId">
                <input type="hidden" id="selectedBookingType">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Imong Tibuok Ngalan (Full Name)</label>
                    <input type="text" id="custName" required placeholder="Juan Dela Cruz" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile / Phone Number</label>
                    <input type="tel" id="custPhone" required placeholder="09171234567" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>

                <div id="modalPriceSummary" class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm flex justify-between font-medium">
                    <span class="text-slate-600">Total nga Bayrunon:</span>
                    <span id="modalTotalAmount" class="text-indigo-600 font-bold">₱0.00</span>
                </div>

                <button type="submit" id="modalSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 text-sm shadow-md">
                    Ipadayon ang Booking
                </button>
            </form>
        </div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('roomCheckIn').value = today;
        document.getElementById('tableDate').value = today;
        const tmrw = new Date();
        tmrw.setDate(tmrw.getDate() + 1);
        document.getElementById('roomCheckOut').value = tmrw.toISOString().split('T')[0];

        function switchTab(type) {
            const secRooms = document.getElementById('sectionRooms');
            const secTables = document.getElementById('sectionTables');
            const btnRooms = document.getElementById('tabRoomBtn');
            const btnTables = document.getElementById('tabTableBtn');

            if (type === 'rooms') {
                secRooms.classList.remove('hidden');
                secTables.classList.add('hidden');
                btnRooms.className = "flex-1 py-3 text-sm font-semibold rounded-xl flex items-center justify-center space-x-2 transition-all duration-200 bg-white text-indigo-600 shadow-sm";
                btnTables.className = "flex-1 py-3 text-sm font-semibold rounded-xl flex items-center justify-center space-x-2 transition-all duration-200 text-slate-600 hover:text-slate-900";
            } else {
                secRooms.classList.add('hidden');
                secTables.classList.remove('hidden');
                btnTables.className = "flex-1 py-3 text-sm font-semibold rounded-xl flex items-center justify-center space-x-2 transition-all duration-200 bg-white text-amber-600 shadow-sm";
                btnRooms.className = "flex-1 py-3 text-sm font-semibold rounded-xl flex items-center justify-center space-x-2 transition-all duration-200 text-slate-600 hover:text-slate-900";
            }
        }

        async function searchRooms(e) {
            e.preventDefault();
            const checkIn = document.getElementById('roomCheckIn').value;
            const checkOut = document.getElementById('roomCheckOut').value;

            try {
                const res = await fetch(`/api/rooms/available?check_in=${checkIn}&check_out=${checkOut}`);
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Adunay problema.');
                    return;
                }

                const grid = document.getElementById('roomsGrid');
                grid.innerHTML = '';
                document.getElementById('roomResultsContainer').classList.remove('hidden');
                document.getElementById('roomCountBadge').innerText = `${data.length} Available`;

                if (data.length === 0) {
                    grid.innerHTML = `<div class="col-span-3 text-center py-8 text-slate-500 font-medium">Puno na ang tanang kwarto sa napiling dates.</div>`;
                    return;
                }

                const nights = Math.max(1, Math.round((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24)));

                data.forEach(r => {
                    const total = nights * r.price_per_night;
                    const card = document.createElement('div');
                    card.className = "bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs uppercase font-bold tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">Room ${r.room_number}</span>
                                <span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-user-group text-slate-400 mr-1"></i> Max ${r.capacity} Pax</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-base mb-1">${r.room_type}</h4>
                            <p class="text-xs text-slate-500 mb-4">Air-conditioned, private bath, hot shower, free Wi-Fi.</p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-slate-400 block">${nights} night(s)</span>
                                <span class="text-base font-bold text-slate-900">₱${total.toLocaleString()}</span>
                            </div>
                            <button onclick="openRoomBookingModal(${r.id}, '${r.room_type}', 'Room ${r.room_number}', ${total})" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                                Book Now
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                alert('Dili ma-konek sa server.');
            }
        }

        function openRoomBookingModal(roomId, type, number, total) {
            document.getElementById('selectedItemId').value = roomId;
            document.getElementById('selectedBookingType').value = 'room';
            document.getElementById('modalTitle').innerText = `Confirm Room: ${number}`;
            document.getElementById('modalSubtitle').innerText = `${type} | ${document.getElementById('roomCheckIn').value} to ${document.getElementById('roomCheckOut').value}`;
            document.getElementById('modalPriceSummary').classList.remove('hidden');
            document.getElementById('modalTotalAmount').innerText = `₱${total.toLocaleString()}`;
            document.getElementById('modalSubmitBtn').className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 text-sm shadow-md";
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        async function searchTables(e) {
            e.preventDefault();
            const date = document.getElementById('tableDate').value;
            const slot = document.getElementById('tableTimeSlot').value;
            const pax = document.getElementById('tablePax').value;

            try {
                const res = await fetch(`/api/tables/available?date=${date}&time_slot=${slot}&pax=${pax}`);
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Adunay problema.');
                    return;
                }

                const grid = document.getElementById('tablesGrid');
                grid.innerHTML = '';
                document.getElementById('tableResultsContainer').classList.remove('hidden');
                document.getElementById('tableCountBadge').innerText = `${data.length} Available`;

                if (data.length === 0) {
                    grid.innerHTML = `<div class="col-span-4 text-center py-8 text-slate-500 font-medium">Walay bakante nga lamesa sa maong time slot.</div>`;
                    return;
                }

                data.forEach(t => {
                    const card = document.createElement('div');
                    card.className = "bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:border-amber-400 transition flex flex-col justify-between";
                    card.innerHTML = `
                        <div class="mb-3">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">${t.table_number}</span>
                                <span class="text-xs text-slate-500 font-medium">${t.capacity} Seats</span>
                            </div>
                            <p class="text-xs font-semibold text-slate-700 mb-1"><i class="fa-solid fa-map-pin text-slate-400 mr-1"></i> ${t.location}</p>
                        </div>
                        <button onclick="openTableBookingModal(${t.id}, '${t.table_number}', '${t.location}')" 
                            class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold py-2 rounded-xl transition shadow-sm">
                            Reserve Table
                        </button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                alert('Dili ma-konek sa server.');
            }
        }

        function openTableBookingModal(tableId, tableNum, location) {
            document.getElementById('selectedItemId').value = tableId;
            document.getElementById('selectedBookingType').value = 'table';
            document.getElementById('modalTitle').innerText = `Reserve Table: ${tableNum}`;
            document.getElementById('modalSubtitle').innerText = `${location} | ${document.getElementById('tableDate').value} (${document.getElementById('tableTimeSlot').value})`;
            document.getElementById('modalPriceSummary').classList.add('hidden');
            document.getElementById('modalSubmitBtn').className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 text-sm shadow-md";
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        async function submitBooking(e) {
            e.preventDefault();
            const type = document.getElementById('selectedBookingType').value;
            const itemId = document.getElementById('selectedItemId').value;
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;

            if (type === 'room') {
                const payload = {
                    room_id: parseInt(itemId),
                    name: name,
                    phone: phone,
                    check_in: document.getElementById('roomCheckIn').value,
                    check_out: document.getElementById('roomCheckOut').value
                };

                const res = await fetch('/api/rooms/book', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    alert(`✅ Malampusong na-book ang Kwarto!\nReference ID: #${data.booking_id}\nTotal: ₱${data.total_price.toLocaleString()}`);
                    closeModal();
                    searchRooms(new Event('submit'));
                } else {
                    alert(`❌ Sayop: ${data.error}`);
                }

            } else if (type === 'table') {
                const payload = {
                    table_id: parseInt(itemId),
                    name: name,
                    phone: phone,
                    date: document.getElementById('tableDate').value,
                    time_slot: document.getElementById('tableTimeSlot').value,
                    pax: parseInt(document.getElementById('tablePax').value)
                };

                const res = await fetch('/api/tables/book', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    alert(`✅ Malampusong na-reserve ang Lamesa!\nReservation ID: #${data.reservation_id}`);
                    closeModal();
                    searchTables(new Event('submit'));
                } else {
                    alert(`❌ Sayop: ${data.error}`);
                }
            }
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.add('hidden');
            document.getElementById('modalForm').reset();
        }
    </script>
</body>
</html>
